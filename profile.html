<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVerse | Profile</title>
    <link rel="stylesheet" href="assest/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="profile-container">
    <aside class="sidebar">
        <div class="profile-image">
            <img src="assets/images/user.png" alt="User">
        </div>
        <h2>Ranjan</h2>
        <p>Pro Gamer</p>
        <ul>
            <li><i class="fa-solid fa-user"></i> Profile</li>
            <li><i class="fa-solid fa-heart"></i> Wishlist</li>
            <li><i class="fa-solid fa-gamepad"></i> Recently Played</li>
            <li><i class="fa-solid fa-trophy"></i> Achievements</li>
            <li><i class="fa-solid fa-gear"></i> Settings</li>
            <li class="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>
        </ul>
    </aside>
    <main class="dashboard">
        <h1>Welcome Back 👋</h1>
        <p>Continue your gaming journey.</p>
        <div class="cards">
            <div class="card">
                <h2>Wishlist</h2>
                <h3>12 Games</h3>
            </div>
            <div class="card">
                <h2>Completed</h2>
                <h3>28 Games</h3>
            </div>
            <div class="card">
                <h2>Achievements</h2>
                <h3>56</h3>
            </div>
            <div class="card">
                <h2>Hours Played</h2>
                <h3>1432 hrs</h3>
            </div>
        </div>
        <div class="recent-games">
            <h2>Recently Played</h2>
            <div class="games">
                <div class="game">🎮 GTA VI</div>
                <div class="game">🎮 Valorant</div>
                <div class="game">🎮 Black Myth Wukong</div>
                <div class="game">🎮 PUBG</div>
            </div>
        </div>
    </main>
</div>
<script type="module" src="assest/javascript/profile.js"></script>
</body>
</html>
